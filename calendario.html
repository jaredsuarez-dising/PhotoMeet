<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario - Gestión de Eventos</title>
    <!-- Icono de la web -->
    <link rel="icon" type="image/x-icon" href="/logo.ico">
    <script type="module">
        import supabase from '/src/js/supabaseClient.js';
        // Importar funciones necesarias y exponerlas globalmente
        import { showAlert } from '/src/js/utils.js';
        import { addComment } from '/src/js/calendar.js';
        
        window.supabase = supabase;
        window.showAlert = showAlert; // Exponer showAlert globalmente
        window.addComment = addComment; // Exponer addComment globalmente

        // La función viewEventDetails es llamada directamente por fullcalendar,
        // y las dependencias (getUserColor) están en el mismo módulo calendar.js
        // o ya están globalmente disponibles (supabase, showAlert).
        // No necesitamos exponer viewEventDetails ni getUserColor globalmente aquí.

    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles/theme.css">
    <style>
        .calendar-container {
            background: var(--bs-body-bg);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .view-buttons {
            margin-bottom: 1rem;
        }
        .view-buttons .btn {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container my-4">
        <div class="calendar-container">
            <div class="view-buttons">
                <button class="btn btn-outline-primary" id="monthView">
                    <i class="bi bi-calendar-month"></i> Mes
                </button>
                <button class="btn btn-outline-primary" id="weekView">
                    <i class="bi bi-calendar-week"></i> Semana
                </button>
                <button class="btn btn-outline-primary" id="dayView">
                    <i class="bi bi-calendar-day"></i> Día
                </button>
            </div>
            <div id="calendar"></div>
        </div>
    </div>

    <!-- Modal para ver detalles del evento -->
    <div class="modal fade" id="eventDetailsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalles del Evento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="eventDetails"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/navbar.js"></script>
    <script type="module" src="/src/js/navigation.js"></script>
    <script src="/src/js/calendar.js" type="module"></script>
    <script>
        // Cerrar sesión
        async function handleLogout() {
            try {
                const { error } = await window.supabase.auth.signOut();
                if (error) throw error;
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
                alert('Error al cerrar sesión');
            }
        }
    </script>
</body>
</html>

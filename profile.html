<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Gestión de Eventos</title>
    <!-- Icono de la web -->
    <link rel="icon" type="image/x-icon" href="/logo.ico">
    <script type="module">
        import supabase from '/src/js/supabaseClient.js';
        import { showLoading, hideLoading, showAlert } from '/src/js/utils.js';
        import { viewEventDetails, getUserColor, addComment } from '/src/js/calendar.js';

        window.supabase = supabase;
        window.showLoading = showLoading;
        window.hideLoading = hideLoading;
        window.showAlert = showAlert;

        window.viewEventDetails = viewEventDetails;
        window.getUserColor = getUserColor;
        window.addComment = addComment;

        let eventModal;
        let deleteEventModal;
        let eventToDelete = null;
        let currentUser = null;
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link href="styles/theme.css" rel="stylesheet">
    <style>
        .profile-header {
            background-color: var(--bs-body-bg);
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .event-card {
            transition: transform 0.2s;
            margin-bottom: 1rem;
            height: 100%;
        }
        .event-card:hover {
            transform: translateY(-5px);
        }
        .event-image {
            height: 200px;
            object-fit: cover;
        }
        .event-actions {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .event-card:hover .event-actions {
            opacity: 1;
        }
        .modal-header {
            background-color: var(--bs-body-bg);
            border-bottom: 1px solid var(--bs-border-color);
        }
        .form-label {
            font-weight: 500;
        }
        .btn-icon {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        .profile-section {
            background-color: var(--bs-body-bg);
            border-radius: 10px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .profile-info {
            margin-top: 1rem;
        }
        .profile-info h3 {
            margin-bottom: 0.5rem;
        }
        .profile-info p {
            margin-bottom: 0.25rem;
        }
        .nav-tabs {
            border-bottom: 2px solid var(--bs-border-color);
        }
        .nav-tabs .nav-link {
            border: none;
            padding: 1rem 1.5rem;
            font-weight: 500;
        }
        .nav-tabs .nav-link.active {
            border-bottom: 2px solid var(--bs-primary);
            background: none;
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container my-4">
        <div class="profile-header">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-3 text-center">
                        <img id="profileImage" src="https://ui-avatars.com/api/?name=Usuario" alt="Foto de perfil" class="profile-image mb-3">
                    </div>
                    <div class="col-md-9">
                        <h2 id="profileName">Usuario</h2>
                        <p class="text-muted">Miembro desde <span id="memberSince">2024</span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col">
                <h3>Mis Eventos</h3>
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" onclick="showAddEventModal()">
                    <i class="bi bi-plus-circle"></i> Crear Evento
                </button>
            </div>
        </div>

        <div class="row" id="userEventsContainer">
            <!-- Los eventos se cargarán dinámicamente aquí -->
        </div>
    </div>

    <!-- Modal para Crear/Editar Evento -->
    <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nuevo Evento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="eventForm">
                        <input type="hidden" id="eventId">
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" class="form-control" id="eventTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="datetime-local" class="form-control" id="eventDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="eventDescription" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ubicación</label>
                            <input type="text" class="form-control" id="eventLocation">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Imagen del Evento</label>
                            <input type="file" class="form-control" id="eventImage" accept="image/*">
                            <small class="form-text text-muted">Formatos permitidos: JPG, PNG, GIF. Tamaño máximo: 5MB</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="saveEvent()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Eliminar Evento -->
    <div class="modal fade" id="deleteEventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>¿Estás seguro de que deseas eliminar este evento? Esta acción no se puede deshacer.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Detalles del Evento (Necesario para viewEventDetails) -->
    <div class="modal fade" id="eventDetailsModal" tabindex="-1" aria-labelledby="eventDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="eventDetailsModalLabel">Detalles del Evento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="eventDetails">
                    <!-- El contenido del evento se cargará aquí -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/navbar.js"></script>
    <script type="module" src="/src/js/navigation.js"></script>
    <script src="/src/js/profile.js" type="module"></script>
</body>
</html>
